name: CI

# No build on a push to main: the work lands there directly and is built
# locally. This runs on pull requests and on demand; release.yml gates tags.
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy (strict)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests (std)
        run: cargo test
      - name: Build no_std
        run: cargo build --no-default-features --features alloc
      - name: Tests no_std
        run: cargo test --no-default-features --features alloc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.81.0
      - name: Build (MSRV 1.81)
        run: cargo build
