name: Release

# Publishes to crates.io when a "vX.Y.Z" tag is pushed, via Trusted
# Publishing (OIDC): no token is stored in the repository. Trust is
# established on the crates.io side by a Trusted Publishing configuration
# pointing at this repository and this workflow file.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for the OIDC exchange with crates.io
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Guard: the "vX.Y.Z" tag must match the Cargo.toml version.
      - name: Check tag ↔ version consistency
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$TAG  Cargo.toml=$CRATE"
          test "$TAG" = "$CRATE" || { echo "::error::tag ($TAG) differs from Cargo.toml version ($CRATE)"; exit 1; }

      # Quality: same guarantees as CI, before any publication.
      - name: Format
        run: cargo fmt --check
      - name: Clippy (strict)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

      # Temporary token obtained via OIDC (no stored secret).
      - name: crates.io authentication (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
