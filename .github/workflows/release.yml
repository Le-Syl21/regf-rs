name: Release

# Publishes to crates.io when a "vX.Y.Z" tag is pushed, via Trusted Publishing
# (OIDC): no long-lived secret is stored. GitHub attests the workflow's identity
# (repo + workflow file + environment) and crates.io issues an ephemeral token,
# revoked when the job ends. Requires a matching Trusted Publishing config on
# crates.io (owner Le-Syl21, repo regf-rs, workflow release.yml, environment
# crates-io).
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write # needed to request the OIDC token from GitHub
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Guard: the "vX.Y.Z" tag must match the Cargo.toml version.
      - name: Check that the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo pkgid | sed 's/.*[#@]//')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $crate — update Cargo.toml, then re-tag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME <-> Cargo.toml $crate: OK"

      # Quality: same guarantees as CI, before any publication.
      - name: Format
        run: cargo fmt --check
      - name: Clippy (strict)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

      - name: Get a temporary crates.io token (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if cargo publish 2>&1 | tee /tmp/publish.log; then
            echo "published"
          elif grep -q "already exists" /tmp/publish.log; then
            echo "this version is already on crates.io — nothing to do"
          else
            exit 1
          fi
