name: Release

# Publie sur crates.io lorsqu'un tag « vX.Y.Z » est poussé, via Trusted
# Publishing (OIDC) : aucun token n'est stocké dans le dépôt. La confiance est
# établie côté crates.io par une configuration Trusted Publishing pointant ce
# dépôt et ce fichier de workflow.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # requis pour l'échange OIDC avec crates.io
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Garde-fou : le tag « vX.Y.Z » doit correspondre à la version du Cargo.toml.
      - name: Vérifie la cohérence tag ↔ version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$TAG  Cargo.toml=$CRATE"
          test "$TAG" = "$CRATE" || { echo "::error::le tag ($TAG) diffère de la version du Cargo.toml ($CRATE)"; exit 1; }

      # Qualité : mêmes garanties que la CI, avant toute publication.
      - name: Format
        run: cargo fmt --check
      - name: Clippy (strict)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

      # Jeton temporaire obtenu par OIDC (aucun secret stocké).
      - name: Authentification crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
